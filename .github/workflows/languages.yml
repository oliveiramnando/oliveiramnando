
name: Update Language Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout card generator
        uses: actions/checkout@v4
        with:
          repository: h1s97x/gh-readme-card
          path: .card-generator
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: .card-generator
        run: npm ci --omit=dev --ignore-scripts

      - name: Patch generator bugs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path(".card-generator/src/fetchers/top-languages.ts")
          source = file.read_text()

          replacements = [
              (
                  "              size\n              languages(",
                  "              size: diskUsage\n              languages("
              ),
              (
                  "  let repoCount = 0;\n",
                  ""
              ),
              (
                  "        repoCount += 1;\n"
                  "        tallies[name] = { ...existing, count: repoCount };",
                  "        existing.count += 1;"
              ),
              (
                  "        repoCount = 1;\n",
                  ""
              ),
              (
                  "          count: repoCount,",
                  "          count: 1,"
              ),
          ]

          for old, new in replacements:
              if source.count(old) != 1:
                  raise RuntimeError(
                      f"Upstream source changed: {old!r}"
                  )
              source = source.replace(old, new, 1)

          file.write_text(source)
          print("Generator patched successfully")
          PY

      - name: Generate language statistics
        env:
          PAT_1: ${{ github.token }}
          GH_CARD_CARD: langs
          GH_CARD_PARAMS: "username=oliveiramnando&layout=compact&langs_count=6&size_weight=0&count_weight=1&card_width=700&bg_color=0d1117&title_color=b392f0&text_color=c9d1d9&hide_border=true&custom_title=Languages%20by%20repo%20count"
          GH_CARD_PATH: profile/langs.svg
        run: node .card-generator/src/cli.ts

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/langs.svg

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update language statistics"
          git push

