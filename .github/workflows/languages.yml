
name: Update Language Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate language statistics
        uses: h1s97x/gh-readme-card@main
        with:
          card: langs
          params: >-
            username=oliveiramnando
            &layout=compact
            &langs_count=6
            &size_weight=0
            &count_weight=1
            &card_width=700
            &bg_color=0d1117
            &title_color=b392f0
            &text_color=c9d1d9
            &hide_border=true
            &custom_title=Languages%20by%20repo%20count
          path: profile/langs.svg

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/langs.svg

          if git diff --staged --quiet; then
            exit 0
          fi

          git commit -m "Update language statistics"
          git push

